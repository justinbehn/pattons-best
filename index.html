<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* This class will hide the picture */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- The image you want to hide or show -->
    <img id="HeavyResistanceTile" src="Heavy.jpg" title="Heavy Resistance Area">

<script>
fetch("config.xml?nocache=" + Date.now())
    .then(response => response.text())
    .then(data => {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data, "text/xml");
        const showImageValue = xmlDoc.getElementsByTagName("showImage")[0].textContent.trim().toLowerCase();
        const picture = document.getElementById("HeavyResistanceTile");

        console.log("XML value:", showImageValue);

        if (showImageValue === "true") {
            picture.classList.remove("hidden");
        } else {
            picture.classList.add("hidden");
        }
    })
    .catch(error => console.error("Error loading XML:", error));
</script>

	

</body>
</html>
